name: Fulfill GXO shipments in Kibo

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: run all checks and read each shipment, but do not call /fulfilled"
        type: boolean
        default: true
      warehouse:
        description: "Warehouse on the SHIPPED event"
        type: string
        default: "GXO"
      shipment_order_numbers:
        description: "Optional: comma separated shipmentOrderNumbers to restrict the run"
        type: string
        default: ""
      limit:
        description: "Optional: maximum number of active shipments to process (0 = no limit)"
        type: string
        default: "0"
      kibo_host:
        description: "Kibo host suffix"
        type: string
        default: "tp3.mozu.com"

concurrency:
  group: fulfill-gxo-shipments
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fulfill:
    name: ${{ inputs.dry_run && 'Dry run' || 'Fulfill' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run
        env:
          BI_BIGQUERY_CREDS: ${{ secrets.BI_BIGQUERY_CREDS }}
          TIL_BIGQUERY_CREDS: ${{ secrets.TIL_BIGQUERY_CREDS }}
          KIBO_API_CREDS: ${{ secrets.KIBO_API_CREDS }}
          INPUT_WAREHOUSE: ${{ inputs.warehouse }}
          INPUT_HOST: ${{ inputs.kibo_host }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_NUMBERS: ${{ inputs.shipment_order_numbers }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          DRY_RUN_FLAG=""
          if [ "$INPUT_DRY_RUN" = "true" ]; then DRY_RUN_FLAG="--dry-run"; fi
          python fulfill_gxo_shipments.py \
            $DRY_RUN_FLAG \
            --warehouse "$INPUT_WAREHOUSE" \
            --host "$INPUT_HOST" \
            --limit "$INPUT_LIMIT" \
            --shipment-order-numbers "$INPUT_NUMBERS" \
            --output "fulfill_gxo_shipments_results.csv"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fulfill-gxo-shipments-results
          path: fulfill_gxo_shipments_results.csv
          if-no-files-found: warn
          retention-days: 30
