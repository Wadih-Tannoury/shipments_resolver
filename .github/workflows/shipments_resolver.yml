name: Shipments resolver

# One workflow for every script in this repository.
#
#   release-held-exchange : release_held_exchange_shipments.py  (runs daily, see schedule)
#   fulfill-gxo           : fulfill_gxo_shipments.py            (manual only)
#   cancel-cancelled      : cancel_cancelled_shipments.py       (manual only)
#   reassign-blocked      : reassign_blocked_shipments.py       (manual only)
#
# The schedule runs only release-held-exchange. To put another script on the schedule,
# add it to the `if:` condition of its job below.

on:
  workflow_dispatch:
    inputs:
      scripts:
        description: "Which script(s) to run"
        type: choice
        options:
          - release-held-exchange
          - fulfill-gxo
          - cancel-cancelled
          - reassign-blocked
          - all
        default: all
      dry_run:
        description: "Dry run: run every check and read, but perform no write"
        type: boolean
        default: false
      numbers:
        description: "Optional: comma separated numbers to restrict the run (orderNumbers for release-held-exchange, shipmentNumbers for reassign-blocked, shipmentOrderNumbers for the others)"
        type: string
        default: ""
      limit:
        description: "Optional: maximum number of rows to process (0 = no limit)"
        type: string
        default: "0"
      kibo_host:
        description: "Kibo host suffix"
        type: string
        default: "tp3.mozu.com"
      mark_scope:
        description: "release-held-exchange: which events get toBeReprocessed = TRUE"
        type: choice
        options:
          - released
          - all
          - none
        default: released
      max_rows_per_transaction:
        description: "release-held-exchange: retry limit, max shipment.itemscanceled rows per transactionId (0 = no limit)"
        type: string
        default: "2"
      include_already_marked:
        description: "release-held-exchange: also process events already flagged toBeReprocessed"
        type: boolean
        default: false
      backfill_shipment_order_number:
        description: "release-held-exchange: add a missing shipmentOrderNumber from the externalOrderId before releasing the hold"
        type: boolean
        default: true
      warehouse:
        description: "fulfill-gxo: warehouse on the SHIPPED event"
        type: string
        default: "GXO"
      oms_status:
        description: "fulfill-gxo: shipmentStatus to keep in oms_active_shipments (empty = no filter)"
        type: string
        default: "READY"
      cancel_oms_status:
        description: "cancel-cancelled: shipmentStatus to keep in oms_active_shipments (empty = no filter)"
        type: string
        default: "READY"
      no_picked_reason:
        description: "cancel-cancelled: what to do when a CANCELLED shipment has no PICKED event"
        type: choice
        options:
          - skip
          - no-inventory
          - customer
        default: skip
      ecommerce_channel:
        description: "cancel-cancelled: shipments on this channel are auto reassigned instead of cancelled (empty = cancel everything)"
        type: string
        default: "ecommerce"
      block_assignment:
        description: "cancel-cancelled: on auto reassign, block the location that cancelled the shipment"
        type: boolean
        default: false
      allowed_sixth_characters:
        description: "cancel-cancelled: optional filter, only act when the generation letter (6th character) is one of these (empty = every generation, the default)"
        type: string
        default: ""
      cancel_extra_args:
        description: "cancel-cancelled: extra flags passed straight to the script, e.g. --cancel-target-status READY --cancel-target-location-pattern '%GX%' --on-no-cancel-target event"
        type: string
        default: ""
      warehouse_cancel:
        description: "cancel-cancelled: send the CANCEL event to GXO before cancelling in Kibo"
        type: boolean
        default: true
      ecommerce_mode:
        description: "cancel-cancelled: what to do with ecommerce shipments"
        type: choice
        options:
          - "none (leave untouched)"
          - "reassign only"
          - "reassign + cancel on repeats"
        default: "none (leave untouched)"
      require_event_target:
        description: "cancel-cancelled: wait for GXO's own CANCELLED event before cancelling in Kibo (off = cancel in Kibo as soon as GXO accepts)"
        type: boolean
        default: false
      repeat_cancel:
        description: "cancel-cancelled: cancel an ecommerce shipment instead of reassigning it when the same products of the order keep coming back cancelled"
        type: boolean
        default: true
      max_cancelled_order_shipments:
        description: "cancel-cancelled: cancelled shipmentOrderNumbers of one order tolerated before cancelling instead of reassigning"
        type: string
        default: "3"
      product_match:
        description: "cancel-cancelled: how 'the same products' is decided when counting the cancelled shipmentOrderNumbers of an order"
        type: choice
        options:
          - exact
          - overlap
          - any
        default: exact
      resolve_cancel_target:
        description: "cancel-cancelled: cancel the shipment of the order found by externalOrderId instead of the REASSIGNED one the event names"
        type: boolean
        default: true
      location_column:
        description: "reassign-blocked: monitoring table column holding the fulfillment location CODE (empty = auto-detect)"
        type: string
        default: ""

concurrency:
  group: shipments-resolver
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-held-exchange:
    name: Release shipments held with exchange${{ inputs.dry_run && ' (dry run)' || '' }}
    # Scheduled runs always include this script.
    if: >-
      github.event_name == 'schedule'
      || inputs.scripts == 'release-held-exchange'
      || inputs.scripts == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run
        env:
          TIL_BIGQUERY_CREDS: ${{ secrets.TIL_BIGQUERY_CREDS }}
          KIBO_API_CREDS: ${{ secrets.KIBO_API_CREDS }}
          INPUT_HOST: ${{ inputs.kibo_host || 'tp3.mozu.com' }}
          INPUT_LIMIT: ${{ inputs.limit || '0' }}
          INPUT_NUMBERS: ${{ inputs.numbers }}
          INPUT_MARK_SCOPE: ${{ inputs.mark_scope || 'released' }}
          INPUT_MAX_ROWS_PER_TX: ${{ inputs.max_rows_per_transaction || '2' }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_INCLUDE_MARKED: ${{ inputs.include_already_marked }}
          INPUT_BACKFILL_SON: ${{ inputs.backfill_shipment_order_number }}
        run: |
          DRY_RUN_FLAG=""
          if [ "$INPUT_DRY_RUN" = "true" ]; then DRY_RUN_FLAG="--dry-run"; fi
          INCLUDE_MARKED_FLAG=""
          if [ "$INPUT_INCLUDE_MARKED" = "true" ]; then INCLUDE_MARKED_FLAG="--include-already-marked"; fi
          NO_BACKFILL_FLAG=""
          if [ "$INPUT_BACKFILL_SON" = "false" ]; then NO_BACKFILL_FLAG="--no-backfill-shipment-order-number"; fi
          python release_held_exchange_shipments.py \
            $DRY_RUN_FLAG \
            $INCLUDE_MARKED_FLAG \
            $NO_BACKFILL_FLAG \
            --host "$INPUT_HOST" \
            --limit "$INPUT_LIMIT" \
            --order-numbers "$INPUT_NUMBERS" \
            --mark-scope "$INPUT_MARK_SCOPE" \
            --max-rows-per-transaction "$INPUT_MAX_ROWS_PER_TX" \
            --output "release_held_exchange_shipments_results.csv"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-held-exchange-shipments-results
          path: release_held_exchange_shipments_results.csv
          if-no-files-found: warn
          retention-days: 30

  fulfill-gxo:
    name: Fulfill GXO shipments in Kibo${{ inputs.dry_run && ' (dry run)' || '' }}
    # Manual runs only. Add `github.event_name == 'schedule' ||` to put it on the schedule.
    if: >-
      inputs.scripts == 'fulfill-gxo'
      || inputs.scripts == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run
        env:
          BI_BIGQUERY_CREDS: ${{ secrets.BI_BIGQUERY_CREDS }}
          TIL_BIGQUERY_CREDS: ${{ secrets.TIL_BIGQUERY_CREDS }}
          KIBO_API_CREDS: ${{ secrets.KIBO_API_CREDS }}
          INPUT_WAREHOUSE: ${{ inputs.warehouse || 'GXO' }}
          INPUT_OMS_STATUS: ${{ inputs.oms_status }}
          INPUT_HOST: ${{ inputs.kibo_host || 'tp3.mozu.com' }}
          INPUT_LIMIT: ${{ inputs.limit || '0' }}
          INPUT_NUMBERS: ${{ inputs.numbers }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          DRY_RUN_FLAG=""
          if [ "$INPUT_DRY_RUN" = "true" ]; then DRY_RUN_FLAG="--dry-run"; fi
          python fulfill_gxo_shipments.py \
            $DRY_RUN_FLAG \
            --warehouse "$INPUT_WAREHOUSE" \
            --oms-status "$INPUT_OMS_STATUS" \
            --host "$INPUT_HOST" \
            --limit "$INPUT_LIMIT" \
            --shipment-order-numbers "$INPUT_NUMBERS" \
            --output "fulfill_gxo_shipments_results.csv"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fulfill-gxo-shipments-results
          path: fulfill_gxo_shipments_results.csv
          if-no-files-found: warn
          retention-days: 30

  cancel-cancelled:
    name: Cancel cancelled shipments in Kibo${{ inputs.dry_run && ' (dry run)' || '' }}
    # Manual runs only. Add `github.event_name == 'schedule' ||` to put it on the schedule.
    if: >-
      inputs.scripts == 'cancel-cancelled'
      || inputs.scripts == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run
        env:
          BI_BIGQUERY_CREDS: ${{ secrets.BI_BIGQUERY_CREDS }}
          TIL_BIGQUERY_CREDS: ${{ secrets.TIL_BIGQUERY_CREDS }}
          KIBO_API_CREDS: ${{ secrets.KIBO_API_CREDS }}
          GXO_API_CREDS: ${{ secrets.GXO_API_CREDS }}
          INPUT_OMS_STATUS: ${{ inputs.cancel_oms_status }}
          INPUT_NO_PICKED_REASON: ${{ inputs.no_picked_reason || 'skip' }}
          INPUT_ECOMMERCE_CHANNEL: ${{ inputs.ecommerce_channel }}
          INPUT_BLOCK_ASSIGNMENT: ${{ inputs.block_assignment }}
          INPUT_ALLOWED_SIXTH: ${{ inputs.allowed_sixth_characters }}
          INPUT_REPEAT_CANCEL: ${{ inputs.repeat_cancel }}
          INPUT_MAX_CANCELLED_ORDER_SHIPMENTS: ${{ inputs.max_cancelled_order_shipments || '3' }}
          INPUT_PRODUCT_MATCH: ${{ inputs.product_match || 'exact' }}
          INPUT_RESOLVE_CANCEL_TARGET: ${{ inputs.resolve_cancel_target }}
          INPUT_CANCEL_EXTRA_ARGS: ${{ inputs.cancel_extra_args }}
          INPUT_WAREHOUSE_CANCEL: ${{ inputs.warehouse_cancel }}
          INPUT_ECOMMERCE_MODE: ${{ inputs.ecommerce_mode }}
          INPUT_REQUIRE_EVENT_TARGET: ${{ inputs.require_event_target }}
          INPUT_HOST: ${{ inputs.kibo_host || 'tp3.mozu.com' }}
          INPUT_LIMIT: ${{ inputs.limit || '0' }}
          INPUT_NUMBERS: ${{ inputs.numbers }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          DRY_RUN_FLAG=""
          if [ "$INPUT_DRY_RUN" = "true" ]; then DRY_RUN_FLAG="--dry-run"; fi
          BLOCK_FLAG=""
          if [ "$INPUT_BLOCK_ASSIGNMENT" = "true" ]; then BLOCK_FLAG="--block-assignment"; fi
          REPEAT_FLAG=""
          if [ "$INPUT_REPEAT_CANCEL" = "false" ]; then REPEAT_FLAG="--no-repeat-cancel"; fi
          TARGET_FLAG=""
          if [ "$INPUT_RESOLVE_CANCEL_TARGET" = "false" ]; then TARGET_FLAG="--no-resolve-cancel-target"; fi
          WAREHOUSE_FLAG=""
          if [ "$INPUT_WAREHOUSE_CANCEL" = "false" ]; then WAREHOUSE_FLAG="--no-warehouse-cancel"; fi
          ECOM_FLAG=""
          REASSIGN_ECOM_FLAG=""
          case "$INPUT_ECOMMERCE_MODE" in
            "reassign only") REASSIGN_ECOM_FLAG="--reassign-ecommerce" ;;
            "reassign + cancel on repeats")
              REASSIGN_ECOM_FLAG="--reassign-ecommerce"
              ECOM_FLAG="--cancel-ecommerce" ;;
          esac
          EVENT_TARGET_FLAG=""
          if [ "$INPUT_REQUIRE_EVENT_TARGET" = "true" ]; then EVENT_TARGET_FLAG="--require-event-target"; fi
          python cancel_cancelled_shipments.py \
            $DRY_RUN_FLAG \
            $BLOCK_FLAG \
            $REPEAT_FLAG \
            $TARGET_FLAG \
            $WAREHOUSE_FLAG \
            $EVENT_TARGET_FLAG \
            $ECOM_FLAG \
            $REASSIGN_ECOM_FLAG \
            --oms-status "$INPUT_OMS_STATUS" \
            --no-picked-reason "$INPUT_NO_PICKED_REASON" \
            --ecommerce-channel "$INPUT_ECOMMERCE_CHANNEL" \
            --max-cancelled-order-shipments "$INPUT_MAX_CANCELLED_ORDER_SHIPMENTS" \
            --product-match "$INPUT_PRODUCT_MATCH" \
            --allowed-sixth-characters "$INPUT_ALLOWED_SIXTH" \
            --host "$INPUT_HOST" \
            --limit "$INPUT_LIMIT" \
            --shipment-order-numbers "$INPUT_NUMBERS" \
            --output "cancel_cancelled_shipments_results.csv" \
            $INPUT_CANCEL_EXTRA_ARGS

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cancel-cancelled-shipments-results
          path: cancel_cancelled_shipments_results.csv
          if-no-files-found: warn
          retention-days: 30

  reassign-blocked:
    name: Reassign blocked shipments in Kibo${{ inputs.dry_run && ' (dry run)' || '' }}
    # Manual runs only. Add `github.event_name == 'schedule' ||` to put it on the schedule.
    if: >-
      inputs.scripts == 'reassign-blocked'
      || inputs.scripts == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run
        env:
          BI_BIGQUERY_CREDS: ${{ secrets.BI_BIGQUERY_CREDS }}
          KIBO_API_CREDS: ${{ secrets.KIBO_API_CREDS }}
          INPUT_HOST: ${{ inputs.kibo_host || 'tp3.mozu.com' }}
          INPUT_LIMIT: ${{ inputs.limit || '0' }}
          INPUT_NUMBERS: ${{ inputs.numbers }}
          INPUT_LOCATION_COLUMN: ${{ inputs.location_column }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          DRY_RUN_FLAG=""
          if [ "$INPUT_DRY_RUN" = "true" ]; then DRY_RUN_FLAG="--dry-run"; fi
          python reassign_blocked_shipments.py \
            $DRY_RUN_FLAG \
            --host "$INPUT_HOST" \
            --limit "$INPUT_LIMIT" \
            --shipment-numbers "$INPUT_NUMBERS" \
            --location-column "$INPUT_LOCATION_COLUMN" \
            --output "reassign_blocked_shipments_results.csv"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reassign-blocked-shipments-results
          path: reassign_blocked_shipments_results.csv
          if-no-files-found: warn
          retention-days: 30
