name: Release shipments held with exchange

on:
  schedule:
    # Every day at 06:00 UTC.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: read and report everything, but call neither Kibo nor the BigQuery update"
        type: boolean
        default: false
      mark_scope:
        description: "Which events get toBeReprocessed = TRUE"
        type: choice
        options:
          - released
          - all
          - none
        default: released
      include_already_marked:
        description: "Also process events whose toBeReprocessed flag is already true"
        type: boolean
        default: false
      order_numbers:
        description: "Optional: comma separated orderNumbers to restrict the run"
        type: string
        default: ""
      limit:
        description: "Optional: maximum number of events to process (0 = no limit)"
        type: string
        default: "0"
      kibo_host:
        description: "Kibo host suffix"
        type: string
        default: "tp3.mozu.com"

concurrency:
  group: release-held-exchange-shipments
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: ${{ inputs.dry_run && 'Dry run' || 'Release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run
        env:
          TIL_BIGQUERY_CREDS: ${{ secrets.TIL_BIGQUERY_CREDS }}
          KIBO_API_CREDS: ${{ secrets.KIBO_API_CREDS }}
          INPUT_HOST: ${{ inputs.kibo_host || 'tp3.mozu.com' }}
          INPUT_LIMIT: ${{ inputs.limit || '0' }}
          INPUT_NUMBERS: ${{ inputs.order_numbers }}
          INPUT_MARK_SCOPE: ${{ inputs.mark_scope || 'released' }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_INCLUDE_MARKED: ${{ inputs.include_already_marked }}
        run: |
          DRY_RUN_FLAG=""
          if [ "$INPUT_DRY_RUN" = "true" ]; then DRY_RUN_FLAG="--dry-run"; fi
          INCLUDE_MARKED_FLAG=""
          if [ "$INPUT_INCLUDE_MARKED" = "true" ]; then INCLUDE_MARKED_FLAG="--include-already-marked"; fi
          python release_held_exchange_shipments.py \
            $DRY_RUN_FLAG \
            $INCLUDE_MARKED_FLAG \
            --host "$INPUT_HOST" \
            --limit "$INPUT_LIMIT" \
            --order-numbers "$INPUT_NUMBERS" \
            --mark-scope "$INPUT_MARK_SCOPE" \
            --output "release_held_exchange_shipments_results.csv"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-held-exchange-shipments-results
          path: release_held_exchange_shipments_results.csv
          if-no-files-found: warn
          retention-days: 30
